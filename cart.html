<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cart | SANKALP 3D</title>

    <link
        rel="stylesheet"
        href="CSS/style.css">

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <div class="container nav">


            <a
                href="homepage.html"
                class="logo">

                <img
                    src="assets/logo.png"
                    alt="SANKALP 3D">

            </a>


            <nav class="nav-links">

                <a href="homepage.html">
                    Home
                </a>

                <a href="about.html">
                    About
                </a>

                <a href="services.html">
                    Services
                </a>

                <a href="products.html">
                    Products
                </a>

                <a href="how-it-works.html">
                    How It Works
                </a>

                <a href="contact.html">
                    Contact
                </a>

            </nav>


            <div class="nav-actions">

                <a
                    href="cart.html"
                    class="cart-link">

                    Cart

                    <span id="cart-count">
                        0
                    </span>

                </a>


                <a
                    href="contact.html"
                    class="button">

                    Get a Quote

                </a>

            </div>


        </div>

    </header>



    <!-- CART -->

    <main>

        <section class="cart-page">

            <div class="container">


                <p class="section-label">
                    YOUR CART
                </p>


                <h1>
                    Your selected<br>
                    creations.
                </h1>


                <div
                    id="cart-items"
                    class="cart-items">

                </div>


                <div class="cart-summary">

                    <div>

                        <span>
                            Total
                        </span>

                        <strong id="cart-total">
                            ₹0
                        </strong>

                    </div>


                    <a
                        href="contact.html"
                        class="button">

                        Proceed with Quote

                    </a>

                </div>


            </div>

        </section>

    </main>



    <!-- FOOTER -->

    <footer>

        <div class="container">

            <p>
                © 2026 SANKALP 3D.
                All Rights Reserved.
            </p>


            <p class="footer-credit">

                Designed & Developed by

                <span>
                    Xennora Solutions
                </span>

            </p>

        </div>

    </footer>



    <script src="JS/script.js"></script>

</body>

</html>
